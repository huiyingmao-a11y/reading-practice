<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英文演講導讀練習</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=Source+Serif+4:ital,wght@0,300;0,400;0,600;1,300&display=swap');

  :root {
    --ink: #1a1614;
    --paper: #f7f3ee;
    --accent: #c04a2b;
    --accent-light: #f0d9d2;
    --muted: #7a6f68;
    --border: #ddd5cc;
    --slide-bg: #1e3a8a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Source Serif 4', Georgia, serif;
    min-height: 100vh;
  }

  header {
    background: var(--ink);
    color: #fff;
    padding: 24px 32px 20px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 16px;
    flex-wrap: wrap;
  }

  header h1 {
    font-family: 'Noto Serif TC', serif;
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    line-height: 1.4;
  }

  header p {
    font-size: 0.82rem;
    color: #b0a89e;
    font-style: italic;
    text-align: right;
    line-height: 1.5;
  }

  .controls {
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 12px 32px;
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }

  .mode-toggle {
    display: flex;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }

  .mode-btn {
    padding: 6px 14px;
    border: none;
    background: none;
    cursor: pointer;
    font-size: 0.8rem;
    color: var(--muted);
    font-family: 'Noto Serif TC', serif;
    transition: background 0.15s, color 0.15s;
    white-space: nowrap;
  }

  .mode-btn.active { background: var(--ink); color: #fff; }

  .rate-control {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.8rem;
    color: var(--muted);
    font-family: 'Noto Serif TC', serif;
  }

  .rate-control input { width: 80px; accent-color: var(--accent); }
  .rate-value { min-width: 30px; font-weight: 600; color: var(--ink); }

  .voice-select {
    font-size: 0.8rem;
    padding: 5px 8px;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    background: #fff;
    color: var(--ink);
    font-family: 'Noto Serif TC', serif;
    cursor: pointer;
    max-width: 180px;
  }

  .hint {
    margin-left: auto;
    font-size: 0.76rem;
    color: var(--muted);
    font-style: italic;
  }

  .main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 32px 24px 80px;
  }

  /* ── Slide block: image left, text right ── */
  .slide-block {
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: 0;
    margin-bottom: 0;
    border-bottom: 1px solid var(--border);
  }

  .slide-block:last-child { border-bottom: none; }

  /* Left: slide image panel */
  .slide-img-panel {
    background: var(--slide-bg);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    position: relative;
  }

  .slide-label {
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #93c5fd;
    font-family: 'Noto Serif TC', serif;
  }

  .slide-img {
    width: 100%;
    border-radius: 4px;
    display: block;
    box-shadow: 0 2px 12px rgba(0,0,0,0.4);
    cursor: pointer;
    transition: transform 0.15s;
  }

  .slide-img:hover { transform: scale(1.01); }

  .play-slide-btn {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.25);
    color: #fff;
    border-radius: 6px;
    padding: 7px 12px;
    font-size: 0.78rem;
    cursor: pointer;
    font-family: 'Noto Serif TC', serif;
    transition: background 0.15s;
    text-align: center;
  }

  .play-slide-btn:hover { background: rgba(255,255,255,0.22); }
  .play-slide-btn.playing { background: var(--accent); border-color: var(--accent); }

  /* Right: text panel */
  .slide-text-panel {
    padding: 20px 24px 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .english-text {
    font-size: 1.08rem;
    line-height: 1.9;
    color: var(--ink);
  }

  .chinese-text {
    font-family: 'Noto Serif TC', serif;
    font-size: 0.9rem;
    line-height: 1.95;
    color: var(--muted);
    border-top: 1px dashed var(--border);
    padding-top: 12px;
  }

  /* Word spans */
  .word {
    display: inline;
    cursor: pointer;
    border-radius: 3px;
    padding: 1px 2px;
    transition: background 0.1s, color 0.1s;
  }

  .word:hover { background: #f0d9d2; }
  .word.playing { background: #c04a2b; color: #fff; border-radius: 3px; }

  .zh-word {
    display: inline;
    cursor: pointer;
    border-radius: 2px;
    padding: 0 1px;
    transition: background 0.1s;
  }

  .zh-word:hover { background: #d6e5f4; }
  .zh-word.playing { background: #3d5a80; color: #fff; }

  /* Lightbox */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 999;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .lightbox.open { display: flex; }

  .lightbox img {
    max-width: 90vw;
    max-height: 90vh;
    border-radius: 6px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.6);
  }

  .lightbox-close {
    position: fixed;
    top: 16px;
    right: 20px;
    color: #fff;
    font-size: 2rem;
    cursor: pointer;
    line-height: 1;
    background: none;
    border: none;
  }

  /* Tooltip */
  .tooltip {
    position: fixed;
    background: var(--ink);
    color: #fff;
    padding: 5px 12px;
    border-radius: 6px;
    font-size: 0.82rem;
    pointer-events: none;
    z-index: 1000;
    opacity: 0;
    transform: translateX(-50%) translateY(-6px);
    transition: opacity 0.15s, transform 0.15s;
    font-family: 'Noto Serif TC', serif;
    white-space: nowrap;
  }

  .tooltip.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Mobile */
  @media (max-width: 700px) {
    .slide-block { grid-template-columns: 1fr; }
    .slide-img-panel { padding: 12px; }
    .slide-text-panel { padding: 16px; }
    .hint { display: none; }
    header p { display: none; }
    .controls { padding: 10px 16px; gap: 10px; }
    .main { padding: 0 0 60px; }
  }
</style>
</head>
<body>

<header>
  <h1>英文演講導讀練習<br><small style="font-weight:300;font-size:0.72em;color:#b0a89e;letter-spacing:0.06em;">Reading Aloud Practice</small></h1>
  <p>點擊任何英文字詞即可聆聽發音<br>點擊投影片圖片可放大</p>
</header>

<div class="controls">
  <div class="mode-toggle">
    <button class="mode-btn active" id="btn-word" onclick="setMode('word')">逐字</button>
    <button class="mode-btn" id="btn-phrase" onclick="setMode('phrase')">整句</button>
    <button class="mode-btn" id="btn-zh" onclick="setMode('zh')">中文</button>
  </div>
  <div class="rate-control">
    <span>語速</span>
    <input type="range" id="rateSlider" min="0.5" max="1.5" step="0.1" value="0.9" oninput="updateRate(this.value)">
    <span class="rate-value" id="rateVal">0.9×</span>
  </div>
  <select class="voice-select" id="voiceSelect" onchange="selectVoice()">
    <option>載入語音中…</option>
  </select>
  <span class="hint">點擊文字播放 ▶　點擊圖片放大 🔍</span>
</div>

<div class="main" id="content"></div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">×</button>
  <img id="lightboxImg" src="" alt="">
</div>

<div class="tooltip" id="tooltip"></div>

// ── State ────────────────────────────────────────────────────────
let mode = 'word';
let rate = 0.9;
let voices = [];
let enVoice = null;
let zhVoice = null;
let currentSpan = null;
const tooltip = document.getElementById('tooltip');
let tooltipTimer = null;

// ── Voices ───────────────────────────────────────────────────────
function loadVoices() {
  voices = speechSynthesis.getVoices();
  if (!voices.length) return;
  const sel = document.getElementById('voiceSelect');
  sel.innerHTML = '';
  const enVoices = voices.filter(v => v.lang.startsWith('en'));
  const zhVoices = voices.filter(v => v.lang.startsWith('zh'));
  enVoices.forEach((v, i) => {
    const o = document.createElement('option');
    o.value = i; o.textContent = '🇺🇸 ' + v.name;
    if (i === 0) o.selected = true;
    sel.appendChild(o);
  });
  if (!enVoices.length) { sel.innerHTML = '<option>⚠️ 未找到英文語音</option>'; }
  enVoice = enVoices.find(v => /en-US/i.test(v.lang) && /google|natural|premium/i.test(v.name))
          || enVoices.find(v => /en-US/i.test(v.lang)) || enVoices[0] || null;
  zhVoice = zhVoices.find(v => /zh-TW/i.test(v.lang)) || zhVoices[0] || null;
}

window.speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

function selectVoice() {
  const idx = parseInt(document.getElementById('voiceSelect').value);
  const enVoices = voices.filter(v => v.lang.startsWith('en'));
  if (!isNaN(idx)) enVoice = enVoices[idx] || enVoice;
}

// ── TTS ──────────────────────────────────────────────────────────
function speak(text, lang, spanEl) {
  speechSynthesis.cancel();
  if (currentSpan) { currentSpan.classList.remove('playing'); currentSpan = null; }
  const u = new SpeechSynthesisUtterance(text);
  u.rate = rate; u.lang = lang;
  if (lang === 'zh-TW' && zhVoice) u.voice = zhVoice;
  else if (lang.startsWith('en') && enVoice) u.voice = enVoice;
  if (spanEl) {
    currentSpan = spanEl; spanEl.classList.add('playing');
    u.onend = () => { spanEl.classList.remove('playing'); if (currentSpan===spanEl) currentSpan=null; };
    u.onerror = () => spanEl.classList.remove('playing');
  }
  speechSynthesis.speak(u);
}

// ── Render ───────────────────────────────────────────────────────
function renderContent() {
  const container = document.getElementById('content');
  container.innerHTML = '';

  slides.forEach(slide => {
    const block = document.createElement('div');
    block.className = 'slide-block';

    // LEFT: image panel
    const imgPanel = document.createElement('div');
    imgPanel.className = 'slide-img-panel';

    const label = document.createElement('div');
    label.className = 'slide-label';
    label.textContent = slide.page;
    imgPanel.appendChild(label);

    const img = document.createElement('img');
    img.className = 'slide-img';
    img.src = slide.img;
    img.alt = slide.page;
    img.onclick = () => openLightbox(slide.img);
    imgPanel.appendChild(img);

    const playBtn = document.createElement('button');
    playBtn.className = 'play-slide-btn';
    playBtn.textContent = '▶ 播放整句英文';
    playBtn.onclick = () => {
      playBtn.classList.add('playing');
      speak(slide.en, 'en-US', playBtn);
    };
    imgPanel.appendChild(playBtn);

    block.appendChild(imgPanel);

    // RIGHT: text panel
    const textPanel = document.createElement('div');
    textPanel.className = 'slide-text-panel';

    if (mode !== 'zh') {
      const enDiv = document.createElement('div');
      enDiv.className = 'english-text';
      buildEnSpans(slide.en, slide.en, enDiv);
      textPanel.appendChild(enDiv);

      const zhDiv = document.createElement('div');
      zhDiv.className = 'chinese-text';
      zhDiv.appendChild(buildZhSpans(slide.zh));
      textPanel.appendChild(zhDiv);
    } else {
      const zhDiv = document.createElement('div');
      zhDiv.className = 'chinese-text';
      zhDiv.style.cssText = 'border-top:none;padding-top:0;color:var(--ink);font-size:1.05rem;';
      zhDiv.appendChild(buildZhSpans(slide.zh));
      textPanel.appendChild(zhDiv);
    }

    block.appendChild(textPanel);
    container.appendChild(block);
  });
}

function buildEnSpans(text, fullText, container) {
  const tokens = text.match(/[\w\u2018\u2019]+|[^\w\s]/g) || [];
  tokens.forEach((tok, i) => {
    if (/[a-zA-Z]/.test(tok)) {
      const sp = document.createElement('span');
      sp.className = 'word';
      sp.textContent = tok;
      sp.onclick = () => {
        const txt = mode === 'phrase' ? fullText : tok;
        speak(txt, 'en-US', sp);
        showTooltip(sp, mode === 'phrase' ? '▶ 整句' : '▶ ' + tok);
      };
      container.appendChild(sp);
      if (i < tokens.length-1 && /[a-zA-Z0-9]/.test(tokens[i+1][0]||''))
        container.appendChild(document.createTextNode(' '));
    } else {
      container.appendChild(document.createTextNode(tok));
      if (i < tokens.length-1 && /[a-zA-Z]/.test(tokens[i+1][0]||''))
        container.appendChild(document.createTextNode(' '));
    }
  });
}

function buildZhSpans(text) {
  const frag = document.createDocumentFragment();
  const parts = text.match(/[0-9]+|[\u4e00-\u9fff\u3000-\u303f\uff00-\uffef\u300c-\u300f\u2018-\u201f]+|[a-zA-Z]+|\s+/g) || [];
  parts.forEach(part => {
    if (/\s/.test(part)) { frag.appendChild(document.createTextNode(part)); return; }
    const sp = document.createElement('span');
    sp.className = 'zh-word';
    sp.textContent = part;
    if (/[\u4e00-\u9fff]/.test(part) || /[a-zA-Z0-9]/.test(part)) {
      sp.onclick = () => { speak(part, 'zh-TW', sp); showTooltip(sp, '▶ ' + part); };
    }
    frag.appendChild(sp);
  });
  return frag;
}

// ── Lightbox ─────────────────────────────────────────────────────
function openLightbox(src) {
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
}

// ── Tooltip ──────────────────────────────────────────────────────
function showTooltip(el, text) {
  const r = el.getBoundingClientRect();
  tooltip.textContent = text;
  tooltip.style.left = (r.left + r.width/2) + 'px';
  tooltip.style.top = (r.top - 36 + window.scrollY) + 'px';
  tooltip.classList.add('show');
  clearTimeout(tooltipTimer);
  tooltipTimer = setTimeout(() => tooltip.classList.remove('show'), 1600);
}

// ── Controls ─────────────────────────────────────────────────────
function setMode(m) {
  mode = m;
  ['word','phrase','zh'].forEach(id =>
    document.getElementById('btn-' + id).classList.toggle('active', id === m));
  renderContent();
}

function updateRate(v) {
  rate = parseFloat(v);
  document.getElementById('rateVal').textContent = rate.toFixed(1) + '×';
}

renderContent();
</script>
